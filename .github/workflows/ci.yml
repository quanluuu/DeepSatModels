# CI: lint + tests on every PR to main and every push to main (SPEC-delivery-pipeline).
# The docker job (build, smoke test, push to Docker Hub) is added in T11.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install ruff
        run: pip install ruff==0.17.3
      - name: Ruff
        run: ruff check app tests api scripts

  test-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit + AppTest
        run: pytest -q tests/test_demo_core.py tests/test_app.py

  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'      # same as the API image
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            requirements-dev.txt
      # tests use a stub predictor, so torch and the weights are not needed here
      - name: Install dependencies
        run: pip install numpy -r api/requirements.txt -r requirements-dev.txt
      - name: API contract tests (AC-AI-01..07)
        run: pytest -q tests/test_api.py
